name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The unit suite is SDK-free, so CI only needs the lightweight deps.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 jsonschema==4.26.0 eth-abi==5.2.0 eth-utils==6.0.0 web3==7.16.0
      - name: Run tests
        run: python -m pytest
      - name: Validate example strategy and contexts against the schemas
        run: |
          python - <<'PY'
          import json, jsonschema, pathlib
          s = json.loads(pathlib.Path("schema/strategy.schema.json").read_text())
          for p in pathlib.Path("strategies").glob("*.json"):
              jsonschema.validate(json.loads(p.read_text()), s); print("ok", p)
          c = json.loads(pathlib.Path("schema/deploy-context.schema.json").read_text())
          for p in pathlib.Path("contexts").glob("*.json"):
              jsonschema.validate(json.loads(p.read_text()), c); print("ok", p)
          PY
