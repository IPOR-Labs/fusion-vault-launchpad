name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The unit suite is SDK-free, so CI only needs the lightweight deps.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 jsonschema==4.26.0 eth-abi==5.2.0 eth-utils==6.0.0 web3==7.16.0
      - name: Run tests
        run: python -m pytest
      - name: Validate example strategy and contexts against the schemas
        run: |
          python - <<'PY'
          import json, jsonschema, pathlib
          s = json.loads(pathlib.Path("schema/strategy.schema.json").read_text())
          for p in pathlib.Path("strategies").glob("*.json"):
              jsonschema.validate(json.loads(p.read_text()), s); print("ok", p)
          c = json.loads(pathlib.Path("schema/deploy-context.schema.json").read_text())
          for p in pathlib.Path("contexts").glob("*.json"):
              jsonschema.validate(json.loads(p.read_text()), c); print("ok", p)
          PY

  import-smoke:
    # Installs the real runtime dependencies (including the SDK) and checks that
    # every module imports and the CLI answers --help. No chain access needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import every module and run --help
        run: |
          python -c "import deploy.cli, deploy.sdk_session, deploy.verification, deploy.rehearsal, deploy.steps; print('imports ok'); print(len(deploy.steps.all_steps()), 'steps')"
          python -m deploy --help > /dev/null
          python tools/spec_lint.py strategies/example-usdc-aave-base.json
          python tools/spec_lint.py strategies/example-wsteth-usdc-loop-base.json
